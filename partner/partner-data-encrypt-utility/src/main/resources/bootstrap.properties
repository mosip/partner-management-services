# Spring Cloud Config
spring.cloud.config.uri=https://dev.mosip.net
spring.cloud.config.label=master
spring.application.name=partner-management
spring.profiles.active=default

# Server Configuration
server.port=9112
server.servlet.context-path=/v1/partnermanagement

# Management and Health Endpoints
management.endpoints.web.exposure.include=info,health,refresh
management.endpoint.health.show-details=always

# Keymanager
pmp.encrypt.data.post.rest.uri=${mosip.kernel.keymanager.url}/v1/keymanager/encrypt
pmp.decrypt.data.post.rest.uri=${mosip.kernel.keymanager.url}/v1/keymanager/decrypt
mosip.service.keymanager.crypto.appId=PMS
mosip.service.keymanager.crypto.refId=PII-DATA

# PMS common
# Regex for request input validation (allows letters, numbers, spaces, and some special characters)
mosip.pms.request.input.validation.regex=^[\\p{L}\\p{N}\\p{M}\\s.,@#&()\\-'?!":;=]+$


