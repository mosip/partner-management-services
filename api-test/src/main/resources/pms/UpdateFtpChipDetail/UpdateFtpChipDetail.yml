UpdateFtpChipDetail:
   Pms_UpdateFtpChipDetail_All_Valid_Smoke:
      endPoint: /v1/partnermanager/ftpchipdetail
      uniqueIdentifier: TC_PMS_UpdateFtpChipDetail_01
      description: Validate that updating FTM Chip details with all valid inputs is successful and the changes are reflected correctly
      role: partner
      checkErrorsOnlyInResponse: true
      restMethod: put
      inputTemplate: pms/UpdateFtpChipDetail/updateFtpChipDetail
      outputTemplate: pms/device/ftmChipDetails/update/updateFtpChipDetailResult
      input: '{
    "ftpChipDetailId": "$ID:CreateFTPChipDetail_All_Valid_Smoke_sid_id$",
    "make": "Make123Updated",
    "model": "MODEL-001",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
    }'

   Pms_UpdateFtpChipDetail_Missing_InputParameter_ftpChipDetailId:
      endPoint: /v1/partnermanager/ftpchipdetail
      uniqueIdentifier: TC_PMS_UpdateFtpChipDetail_02
      description: Validate that updating FTM Chip details fails when the ftpChipDetailId parameter is missing
      role: partner
      restMethod: put
      inputTemplate: pms/UpdateFtpChipDetail/updateFtpChipDetail
      outputTemplate: pms/error
      input: '{
    "ftpChipDetailId": "$REMOVE$",
    "make": "Make123",
    "model": "MODEL-001",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
}'