CreateOIDCClient:
   Pms_CreateOIDCClient_all_Valid_Smoke_sid:
      endPoint: /v1/partnermanager/oauth/client
      description: Validate that an OIDC client is created successfully with all required valid inputs as part of a smoke test
      uniqueIdentifier: TC_PMS_CreateOIDCClient_01
      role: partnerauth
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: pms/OIDCClient/oIDCClient
      outputTemplate: pms/OIDCClient/oIDCClientResult
      input: '{
      	"requestTime": "$TIMESTAMP$",
      	"name": "OIDC TEST CLIENT 89766",
      	"policyId": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_id$",
      	"publicKey": "$JWKKEY$",
      	"authPartnerId": "$ID:PartnerSelfRegistration_All_Valid_Smoke_sid_partnerId$",
      	"logoUri": "https://health-services.com/logo.png",
      	"redirectUris": "$IDPREDIRECTURI$",
      	"grantTypes": "authorization_code",
      	"clientAuthMethods": "private_key_jwt"
}'
      output: '{
        "clientId": "$IGNORE$",
    	"status": "ACTIVE"
}'

