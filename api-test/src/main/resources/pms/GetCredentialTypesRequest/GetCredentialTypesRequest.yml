GetCredentialTypesRequest:
   Pms_GetCredentialTypesRequest_allValid_smoke:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/credential-types-request
      uniqueIdentifier: TC_PMS_GetCredentialTypesRequest_01
      description: Validate that credential types request for a partner-policy request are successfully retrieved with a valid requestId
      role: partneradmin
      restMethod: get
      inputTemplate: pms/GetCredentialTypesRequest/getCredentialTypesRequest
      outputTemplate: pms/GetCredentialTypesRequest/getCredentialTypesRequestResult
      input: '{
    "requestId": "$ID:SubmitPartnerApiKeyRequest_Rejection_All_Valid_Smoke_sid_mappingkey$"
}'
      output: '{
  "partnerPolicyRequestId": "$ID:SubmitPartnerApiKeyRequest_Rejection_All_Valid_Smoke_sid_mappingkey$",
  "statusCode": "InProgress",
  "credentialType": "auth"
}'

   Pms_GetCredentialTypesRequest_InValid_requestId_Neg:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/credential-types-request
      uniqueIdentifier: TC_PMS_GetCredentialTypesRequest_02
      description: Validate that credential types request retrieval fails when an invalid requestId is provided
      role: partneradmin
      restMethod: get
      inputTemplate: pms/GetCredentialTypesRequest/getCredentialTypesRequest
      outputTemplate: pms/error
      input: '{
    "requestId": "invalid-request-id"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_PRT_064"
    }
  ]
}'

   Pms_GetCredentialTypesRequest_Without_AccessToken_Neg:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/credential-types-request
      uniqueIdentifier: TC_PMS_GetCredentialTypesRequest_03
      description: Validate that credential types request retrieval fails when no access token is provided
      role: invalidtoken
      restMethod: get
      inputTemplate: pms/GetCredentialTypesRequest/getCredentialTypesRequest
      outputTemplate: pms/error
      input: '{
    "requestId": "$ID:SubmitPartnerApiKeyRequest_Rejection_All_Valid_Smoke_sid_mappingkey$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-ATH-401"
    }
  ]
}'

   Pms_GetCredentialTypesRequest_SpecialChar_requestId_Neg:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/credential-types-request
      uniqueIdentifier: TC_PMS_GetCredentialTypesRequest_04
      description: Validate that credential types request retrieval fails when a special character requestId is provided
      role: partneradmin
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: pms/GetCredentialTypesRequest/getCredentialTypesRequest
      outputTemplate: pms/responseCode
      input: '{
    "requestId": "!@#$%^*()"
}'
      output: '{
   "responseCode": "400"
}'

   Pms_GetCredentialTypesRequest_Empty_requestId_Neg:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/credential-types-request
      uniqueIdentifier: TC_PMS_GetCredentialTypesRequest_05
      description: Validate that credential types request retrieval fails when an empty requestId is provided
      role: partneradmin
      restMethod: get
      inputTemplate: pms/GetCredentialTypesRequest/getCredentialTypesRequest
      outputTemplate: pms/error
      input: '{
    "requestId": ""
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_REQUEST_ERROR_001"
    }
  ]
}'

   Pms_GetCredentialTypesRequest_NonExisting_requestId_Neg:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/credential-types-request
