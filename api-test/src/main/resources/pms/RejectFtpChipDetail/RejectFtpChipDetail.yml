RejectFtpChipDetail:
   Pms_rejectFtpChipDetail_All_Valid_Smoke:
      endPoint: /v1/partnermanager/ftpchipdetail
      uniqueIdentifier: TC_PMS_rejectFtpChipDetail_01
      description: Validate that FTM chip details can be rejected successfully with all valid inputs
      role: partner
      checkErrorsOnlyInResponse: true
      restMethod: patch
      inputTemplate: pms/RejectFtpChipDetail/rejectFtpChipDetail
      outputTemplate: pms/RejectFtpChipDetail/rejectFtpChipDetailResult
      input: '{
    "approvalStatus": false,
    "ftpChipDetailId": "$ID:CreateFTPChipDetail_All_Valid_Smoke_sid_id$",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
    }'

   Pms_rejectFtpChipDetail_Missing_InputParameter_ftpChipDetailId:
      endPoint: /v1/partnermanager/ftpchipdetail
      uniqueIdentifier: TC_PMS_rejectFtpChipDetail_02
      description: Validate that rejecting FTM chip details fails when the ftpChipDetailId is missing
      role: partner
      restMethod: patch
      inputTemplate: pms/RejectFtpChipDetail/rejectFtpChipDetail
      outputTemplate: pms/error
      input: '{
    "approvalStatus": true,
    "ftpChipDetailId": "$REMOVE$",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
}'