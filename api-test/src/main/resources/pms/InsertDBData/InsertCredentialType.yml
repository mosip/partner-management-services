InsertCredentialType:
   PMS_InsertDBData_For_Second_CredentialType_qrcode:
      endPoint: no endpoint
      uniqueIdentifier: TC_DBDependent_InsertQuery_04
      description: Validate that a second, distinct active credential type (qrcode) is inserted successfully for the same partnerId and policyId that already has an approved auth credential type
      role: partnerauth
      restMethod: post
      additionalDependencies: TC_PMS_GetCredentialTypesByPartnerAndPolicy_01
      inputTemplate: pms/InsertDBData/InsertCredentialType
      outputTemplate: pms/InsertDBData/InsertCredentialTypeResult
      input: '{
      "partner_id": "$ID:PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid_partnerId$",
      "policy_id": "$ID:DefineDataSharePolicy_All_Valid_Smoke_sid_id$"
}'
      output: '{
}'
   PMS_InsertDBData_For_Inactive_CredentialType_euin:
      endPoint: no endpoint
      uniqueIdentifier: TC_DBDependent_InsertQuery_05
      description: Validate that an inactive (is_active=false) credential type mapping does not appear in the GET credential types response for the same partnerId and policyId
      role: partnerauth
      restMethod: post
      additionalDependencies: TC_PMS_GetCredentialTypesByPartnerAndPolicy_14
      inputTemplate: pms/InsertDBData/InsertCredentialTypeInactive
      outputTemplate: pms/InsertDBData/InsertCredentialTypeResult
      input: '{
      "partner_id": "$ID:PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid_partnerId$",
      "policy_id": "$ID:DefineDataSharePolicy_All_Valid_Smoke_sid_id$"
}'
      output: '{
}'
   PMS_InsertDBData_For_Deleted_CredentialType_reprint:
      endPoint: no endpoint
      uniqueIdentifier: TC_DBDependent_InsertQuery_06
      description: Validate that a soft-deleted (is_deleted=true) credential type mapping does not appear in the GET credential types response for the same partnerId and policyId
      role: partnerauth
      restMethod: post
      additionalDependencies: TC_DBDependent_InsertQuery_05
      inputTemplate: pms/InsertDBData/InsertCredentialTypeDeleted
      outputTemplate: pms/InsertDBData/InsertCredentialTypeResult
      input: '{
      "partner_id": "$ID:PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid_partnerId$",
      "policy_id": "$ID:DefineDataSharePolicy_All_Valid_Smoke_sid_id$"
}'
      output: '{
}'
