uploadPartnerCert:
   Pms_UploadPartnerCert_All_Valid_Smoke_Sid:
      endPoint: /v1/partnermanager/partners/certificate/upload
      uniqueIdentifier: TC_PMS_uploadPartnerCert_01
      description: Validate that uploading a Partner Certificate with all valid inputs including sid is successful
      role: partnerauth
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: pms/UploadPartnerCert/uploadCert
      outputTemplate: pms/UploadPartnerCert/uploadCertResult
      input: '{  
  "requesttime": "$TIMESTAMP$",
  "certificateData": "$PARTNERCERT$",
  "partnerId": "$ID:PartnerSelfRegistration_All_Valid_Smoke_sid_partnerId$",
  "partnerDomain": "AUTH"
}'
      output: ' {
}'

   Pms_UploadPartnerCert_uploadCertificateDeviceProvider_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/certificate/upload
      uniqueIdentifier: TC_PMS_uploadPartnerCert_03
