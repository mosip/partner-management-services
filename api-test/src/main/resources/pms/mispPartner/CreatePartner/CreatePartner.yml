createPartnerSelfRegistration:
   Pms_PartnerSelfRegistration_MispPartner_All_Valid_Smoke_sid:
      endPoint: /v1/partnermanager/partners
      uniqueIdentifier: TC_PMS_createPartnerSelfRegistration_misp__01
      description: Validate that a MISP partner can successfully complete self registration with all required valid inputs as part of a smoke test
      role: partner
      restMethod: post
      inputTemplate: pms/mispPartner/CreatePartner/createPartner
      outputTemplate: pms/mispPartner/CreatePartner/createPartnerResult
      input: '{
    "address": "Bangalore",
    "contactNumber": "9553967572",
    "emailId": "$RUNCONTEXT$oldmisp@gmail.com",
    "organizationName": "$RUNCONTEXT$MISP-AUTOMATION",
    "partnerId": "$RUNCONTEXT$MISP-AUTOMATION",
    "partnerType": "MISP_Partner",
    "policyGroup": "$ID:UpdatePolicyGroup_activate_All_Valid_Smoke_Sid_name$",
	"requesttime": "$TIMESTAMP$"
  }'
      output: ' {
        "partnerId": "$RUNCONTEXT$MISP-AUTOMATION",
        "status": "InProgress"
    }'
