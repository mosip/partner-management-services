uploadCert:
   Pms_UploadCACertificate_Misp_Automation_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_uploadcaCertMisp_01
      description: Validate that a CA certificate is uploaded successfully with all required valid inputs, as part of a smoke test
      role: partner
      restMethod: post
      inputTemplate: pms/mispPartner/UploadCertificate/uploadCertificate
      outputTemplate: pms/mispPartner/UploadCertificate/uploadCertificateResult
      input: '{
      "requesttime": "$TIMESTAMP$",
      "certificateData": "$MISPCACERT$",
      "partnerId": "$ID:PartnerSelfRegistration_MispPartner_All_Valid_Smoke_sid_partnerId$"
}'
      output: ' {
      "status": "Upload Success."
}'  
