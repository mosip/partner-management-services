UploadPartnerCert:
   Pms_UploadCert_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/certificate/upload
      uniqueIdentifier: TC_PMS_UploadMispPartnerCert_01
      description: Validate that certificates are uploaded successfully with all required valid inputs as part of a smoke test
      role: partner
      checkErrorsOnlyInResponse: true
      additionalDependencies: TC_PMS_uploadcaCertMisp_01, TC_PMS_uploadsubcaCertMisp_02
      restMethod: put
      inputTemplate: pms/mispPartner/UploadCert/uploadCert
      outputTemplate: pms/mispPartner/UploadCert/uploadCertResult
      input: '{
  "certificateData": "$MISPPARTNERCERT$",
  "partnerId": "$ID:PartnerSelfRegistration_MispPartner_All_Valid_Smoke_sid_partnerId$",
  "requesttime": "$TIMESTAMP$"
}'
      output: ' {
}'  
