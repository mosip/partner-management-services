MISPPartnerExists:
  Pms_MISPPartnerExists_All_Valid_Smoke:
    endPoint: /v1/partnermanager/partners/exists
    uniqueIdentifier: TC_PMS_MISPPartnerExists_01
    description: Validate that the API successfully confirms the existence of a MISP partner when all required valid parameters are provided as part of a smoke test
    role: partneradmin
    restMethod: put
    inputTemplate: pms/MISPPartnerV3/MISPPartnerExists/MISPPartnerExists
    outputTemplate: pms/MISPPartnerV3/MISPPartnerExists/MISPPartnerExistsResult
    input: '{
      "id": "mosip.pms.partner.exists.post",
      "version": "1.0",
      "requestTime": "$TIMESTAMP$",
      "emailId": "newmisppartnerapiauto@gmail.com",
      "partnerId": "$ID:MISPPartnerRegistration_All_Valid_Smoke_reqsid_Sid_partnerId$",
      "partnerType": "MISP_Partner"
}'
    output: '{
      "partnerExists": true,
      "duplicateExists": false
}'