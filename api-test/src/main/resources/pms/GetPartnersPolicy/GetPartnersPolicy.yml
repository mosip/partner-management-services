GetPartnersPolicy:
   Pms_GetPartnersPolicy_allValid_smoke:
      endPoint: /v1/policymanager/policies/{policyId}/partner/{partnerId}
      uniqueIdentifier: TC_PMS_GetPartnersPolicy_01
      description: Validate that all policies associated with partners are retrieved successfully for a valid request
      role: partner
      checkErrorsOnlyInResponse: true
      restMethod: get
      inputTemplate: pms/GetPartnersPolicy/getPartnersPolicy
      outputTemplate: pms/GetPartnersPolicy/getPartnersPolicyResult
      input: '{
    "partnerId": "mpartner-default-auth",
    "policyId": "mpolicy-default-auth",
    "requesttime": "$TIMESTAMP$"
}'
      output: '{
    "policyGroupId": "mpolicygroup-default-auth",
    "policyGroupName": "mpolicygroup-default-auth",
    "policyId": "$IGNORE$",
    "policyName": "$IGNORE$",
    "status": "PUBLISHED"
}'

   Pms_GetPartnersPolicy_invalid_partnerId:
      endPoint: /v1/policymanager/policies/{policyId}/partner/{partnerId}
      uniqueIdentifier: TC_PMS_GetPartnersPolicy_02
      description: Validate that retrieving partner policies fails when an invalid partner ID is provided
      role: partner
      restMethod: get
      inputTemplate: pms/GetPartnersPolicy/getPartnersPolicy
      outputTemplate: pms/error
      input: '{
    "partnerId": "abcd",
    "policyId": "mpolicy-default-auth",
    "requesttime": "$TIMESTAMP$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_POL_017"
    }
  ]
}'