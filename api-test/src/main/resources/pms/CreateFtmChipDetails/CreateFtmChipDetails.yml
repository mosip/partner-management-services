CreateFtmChipDetails:
   Pms_CreateFtmChipDetails_FtmProvider_AllValid_Smoke_sid:
      endPoint: /v1/partnermanager/ftpchipdetail
      role: partnerftm
      description: Validate that FTM chip details are successfully created for an FTM provider when all inputs are valid
      uniqueIdentifier: TC_PMS_createFtmChipDetails_01
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: pms/CreateFtmChipDetails/CreateFtmChipDetails
      outputTemplate: pms/CreateFtmChipDetails/CreateFtmChipDetailsResult
      input: '{
       "ftpProviderId": "$ID:PartnerSelfRegistration_Ftm_provider_All_Valid_Smoke_sid_partnerId$",
       "make": "AcmeCorpFtm",
       "model": "mode2"

}'
      output: '{
          
}'

   Partner_CreateFTPChipDetail_All_Valid_Smoke_sid:
      endPoint: /v1/partnermanager/ftpchipdetail
      uniqueIdentifier: TC_PMS_CreateFTPChipDetail_01
      description: Validate that FTP chip details are successfully created when all required inputs are valid
      role: partnerftm
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: pms/CreateFtmChipDetails/CreateFtmChipDetails
      outputTemplate: pms/CreateFtmChipDetails/CreateFtmChipDetailsResult
      input: '{
    "ftpProviderId": "$ID:PartnerSelfRegistration_Ftm_provider_All_Valid_Smoke_sid_partnerId$",
    "make": "Make123",
    "model": "MODEL-01",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
      "id": "$IGNORE$"
}'

   Pms_CreateFTPChipDetail_Missing_InputParameter_ftpProviderId:
      endPoint: /v1/partnermanager/ftpchipdetail
      uniqueIdentifier: TC_PMS_CreateFTPChipDetail_02
      description: Validate that FTP chip detail creation fails when the FTP provider ID input parameter is missing
      role: partner
      restMethod: post
      inputTemplate: pms/CreateFtmChipDetails/CreateFtmChipDetails
      outputTemplate: pms/error
      input: '{
    "ftpProviderId": "FTP-AUTOMATION",
    "make": "$REMOVE$",
    "model": "MODEL-01",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
}'

   Pms_CreateFTPChipDetail_Missing_InputParameter_ftpId:
      endPoint: /v1/partnermanager/ftpchipdetail
      uniqueIdentifier: TC_PMS_CreateFTPChipDetail_03
      description: Validate that FTP chip detail creation fails when the FTP ID input parameter is missing
      role: partner
      restMethod: post
      inputTemplate: pms/CreateFtmChipDetails/CreateFtmChipDetails
      outputTemplate: pms/error
      input: '{
    "ftpProviderId": "$REMOVE$",
    "make": "Make123",
    "model": "MODEL-01",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
}'
