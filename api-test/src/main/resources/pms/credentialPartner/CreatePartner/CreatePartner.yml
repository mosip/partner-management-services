CreatePartnerSelfRegistration:
   Pms_PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid:
      endPoint: /v1/partnermanager/partners
      uniqueIdentifier: TC_PMS_createCredentialPartnerSelfRegistration_01
      description: Validate that a credential partner successfully completes self-registration when all inputs are valid
      role: partner
      restMethod: post
      inputTemplate: pms/credentialPartner/CreatePartner/createPartner
      outputTemplate: pms/credentialPartner/CreatePartner/createPartnerResult
      input: '{
    "address": "Bangalore",
    "contactNumber": "9553967572",
    "emailId": "$RUNCONTEXT$movp@gmail.com",
    "organizationName": "$RUNCONTEXT$MOVP-AUTOMATION",
    "partnerId": "$RUNCONTEXT$MOVP-AUTOMATION",
    "partnerType": "Credential_Partner",
    "policyGroup": "$ID:UpdatePolicyGroup_activate_All_Valid_Smoke_Sid_name$",
	"requesttime": "$TIMESTAMP$"
  }'
      output: ' {
        "partnerId": "$RUNCONTEXT$MOVP-AUTOMATION",
        "status": "InProgress"
    }'
    
   Pms_PartnerSelfRegistration_credentialpartner_WithOut_Mandatory_Neg:
      endPoint: /v1/partnermanager/partners
      uniqueIdentifier: TC_PMS_createCredentialPartnerSelfRegistration_02
      description: Validate that credential partner self-registration fails when mandatory input parameters are missing
      role: partner
      restMethod: post
      inputTemplate: pms/credentialPartner/CreatePartner/createPartner
      outputTemplate: pms/error
      input: '{
    "address": "Bangalore",
    "contactNumber": "9553967572",
    "emailId": "movp@gmail.com",
    "organizationName": "movp",
    "partnerId": "$REMOVE$",
    "partnerType": "Credential_Partner",
    "policyGroup": "$ID:UpdatePolicyGroup_activate_All_Valid_Smoke_Sid_name$",
	"requesttime": "$TIMESTAMP$"
  }'
      output: ' {
       "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
    }'
    
   Pms_PartnerSelfRegistration_credentialpartner_Same_Email:
      endPoint: /v1/partnermanager/partners
      uniqueIdentifier: TC_PMS_createCredentialPartnerSelfRegistration_03
      description: Validate that credential partner self-registration fails when the email address is already in use
      role: partner
      restMethod: post
      inputTemplate: pms/credentialPartner/CreatePartner/createPartner
      outputTemplate: pms/error
      input: '{
    "address": "Bangalore",
    "contactNumber": "9553967572",
    "emailId": "$RUNCONTEXT$movp@gmail.com",
    "organizationName": "movp",
    "partnerId": "MOVP-AUTOMATION",
    "partnerType": "Credential_Partner",
    "policyGroup": "$ID:UpdatePolicyGroup_activate_All_Valid_Smoke_Sid_name$",
	"requesttime": "$TIMESTAMP$"
  }'
      output: ' {
       "errors": [
    {
      "errorCode": "PMS_PRT_011"
    }
  ]
    }'

   Pms_PartnerSelfRegistration_credentialpartner_ForCredentialTypeRole_All_Valid_sid:
      endPoint: /v1/partnermanager/partners
      uniqueIdentifier: TC_PMS_createCredentialPartnerSelfRegistration_04
      description: Validate that a credential partner successfully completes self-registration when all inputs are valid (dedicated second credential partner, isolated from the shared MOVP-AUTOMATION fixture so the credential-types-request PARTNER role positive test has its own never-before-mapped partner)
      role: partner
      restMethod: post
      inputTemplate: pms/credentialPartner/CreatePartner/createPartner
      outputTemplate: pms/credentialPartner/CreatePartner/createPartnerResult
      input: '{
    "address": "Bangalore",
    "contactNumber": "9553967572",
    "emailId": "$RUNCONTEXT$movp-ct18@gmail.com",
    "organizationName": "$RUNCONTEXT$MOVP-CT18-AUTOMATION",
    "partnerId": "$RUNCONTEXT$MOVP-CT18-AUTOMATION",
    "partnerType": "Credential_Partner",
    "policyGroup": "$ID:UpdatePolicyGroup_activate_All_Valid_Smoke_Sid_name$",
	"requesttime": "$TIMESTAMP$"
  }'
      output: ' {
        "partnerId": "$RUNCONTEXT$MOVP-CT18-AUTOMATION",
        "status": "InProgress"
    }'