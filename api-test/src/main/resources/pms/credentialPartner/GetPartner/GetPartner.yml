GetPartnerCert:
   Pms_GetPartner_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/{partnerId}
      uniqueIdentifier: TC_PMS_getOnlineVerificationPartner_01
      description: Validate that all partner details are successfully retrieved when valid inputs are provided
      role: partner
      restMethod: get
      inputTemplate: pms/credentialPartner/GetPartner/getPartner
      outputTemplate: pms/credentialPartner/GetPartner/getPartnerResult
      input: '{
	"partnerId": "$ID:PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid_partnerId$"
}'
      output: '  {
    "partnerID": "$ID:PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid_partnerId$",
    "errors": "[]"
  }'
  
   Pms_GetPartner_invalid_partnerId:
      endPoint: /v1/partnermanager/partners/{partnerId}
      uniqueIdentifier: TC_PMS_getOnlineVerificationPartner_02
      description: Validate that retrieving partner details fails when an invalid partner ID is provided
      role: partner
      restMethod: get
      inputTemplate: pms/credentialPartner/GetPartner/getPartner
      outputTemplate: pms/error
      input: '{
    "partnerId": "abcd_dxxxxxyz"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_PRT_005"
    }
  ]
}'
  
   Pms_GetPartner_CrossPartner_BOLA_Neg:
      endPoint: /v1/partnermanager/partners/{partnerId}
      uniqueIdentifier: TC_PMS_getOnlineVerificationPartner_03
      description: Validate that a partner cannot retrieve the details of a partner it does not own
      role: partnerauth
      restMethod: get
      additionalDependencies: TC_PMS_createCredentialPartnerSelfRegistration_01
      inputTemplate: pms/credentialPartner/GetPartner/getPartner
      outputTemplate: pms/error
      input: '{
	"partnerId": "$ID:PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid_partnerId$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_PRT_055"
    }
  ]
}'
