      role: partner
      additionalDependencies: TC_PMS_createCredentialPartnerSelfRegistration_04
      restMethod: post
      inputTemplate: pms/credentialPartner/UploadCertificate/uploadCertificate
      outputTemplate: pms/credentialPartner/UploadCertificate/uploadCertificateResult
      input: '{
 	"requesttime": "$TIMESTAMP$",
  "certificateData": "$CACERT$",
  "partnerId": "$ID:PartnerSelfRegistration_credentialpartner_ForCredentialTypeRole_All_Valid_sid_partnerId$"
  }'
      output: ' {
      "status": "Upload Success."
}'
   Pms_UploadSUBCACertificate_ForCredentialTypeRole_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_uploadCredentialPartnerSubcaCert_05
      description: Validate that Sub CA certificates are successfully uploaded when all inputs are valid (for the dedicated second credential partner used by the credential-types-request PARTNER role positive test)
      role: partner
      additionalDependencies: TC_PMS_createCredentialPartnerSelfRegistration_04
      restMethod: post
      inputTemplate: pms/credentialPartner/UploadCertificate/uploadCertificate
      outputTemplate: pms/credentialPartner/UploadCertificate/uploadCertificateResult
      input: '{
 	"requesttime": "$TIMESTAMP$",
  "certificateData": "$INTERCERT$",
  "partnerId": "$ID:PartnerSelfRegistration_credentialpartner_ForCredentialTypeRole_All_Valid_sid_partnerId$"
  }'
      output: ' {
      "status": "Upload Success."
}'
