uploadCert:
   Pms_UploadCACertificate_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_uploadCredentialPartnerCACert_01
      description: Validate that CA certificates are successfully uploaded when all inputs are valid
      role: partner
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: pms/credentialPartner/UploadCertificate/uploadCertificate
      outputTemplate: pms/credentialPartner/UploadCertificate/uploadCertificateResult
      input: '{
 	"requesttime": "$TIMESTAMP$"
  }'
      output: ' {
}'
   Pms_UploadCACertificate_with_invalid_certs_data:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_uploadCredentialPartnerCACert_02
      description: Validate that CA certificate upload fails when invalid certificate data is provided
      role: partner
      checkErrorsOnlyInResponse: true
      restMethod: post
      allowedErrorCodes:  KER-CRY-003,KER-KMS-013
      inputTemplate: pms/credentialPartner/UploadCertificate/uploadInvalidCertificate
      outputTemplate: pms/error
      input: '{
 	"requesttime": "$TIMESTAMP$"
  }'
      output: ' {
    "errors": [
    {
      "errorCode": "KER-CRY-003"
    }
  ]
    }'
   Pms_UploadSUBCACertificate_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_uploadCredentialPartnerSubcaCert_03
      description: Validate that Sub CA certificates are successfully uploaded when all inputs are valid
      role: partner
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: pms/credentialPartner/UploadCertificate/uploadSUBCACertificate
      outputTemplate: pms/credentialPartner/UploadCertificate/uploadCertificateResult
      input: '{
 	"requesttime": "$TIMESTAMP$"
  }'
      output: ' {
}'
