AddBioExtractors:
   Pms_AddBioExtractors_MosipDataSharePolicy_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/{partnerId}/bioextractors/{policyId}
      uniqueIdentifier: TC_PMS_addBioExtractors_01
      description: Validate that bio extractors can be successfully added under the Mosip Data Share policy when all inputs are valid
      role: partner
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: pms/credentialPartner/AddBioExtractors/addBioExtractors
      outputTemplate: pms/credentialPartner/AddBioExtractors/addBioExtractorsResult
      input: '{
	"partnerId":"$ID:PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid_partnerId$",
	"policyId":"$ID:DefineDataSharePolicy_All_Valid_Smoke_sid_id$",
	"requesttime": "$TIMESTAMP$"
  }'

   Pms_AddBioExtractors_MosipPolicy_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/{partnerId}/bioextractors/{policyId}
