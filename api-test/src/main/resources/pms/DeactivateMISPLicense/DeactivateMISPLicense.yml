DeactivateMISPLicense:
  Pms_DeactivateMISPLicense:
    endPoint: /v1/partnermanager/misp-licenses/{mispLicenseId}
    uniqueIdentifier: TC_PMS_DeactivateMISPLicense_01
    description: Validate that the MISP license is successfully deactivated with valid inputs
    role: partneradmin
    restMethod: patch
    inputTemplate: pms/MispLicenseV3/DeactivateMISPPartnerLicense/DeactivateMISPPartnerLicense
    outputTemplate: pms/MispLicenseV3/DeactivateMISPPartnerLicense/DeactivateMISPPartnerLicenseResult
    input: '{
      "id": "mosip.pms.update.misp.license.patch",
      "version": "1.0",
      "requestTime": "$TIMESTAMP$",
      "mispLicenseId": "$ID:GenerateMISPPartnerLicense_without_PolicyGroup_sid_mispLicenseId$",
      "status": "INACTIVE"
}'
    output: '{
      "status": "INACTIVE"
}'