GetPartnerExpiringCertificate:
   Pms_GetPartnerExpiringCertificate_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/partner-certificates-details
      role: partnerdevice
      description: Validate that all partner certificates nearing expiry are retrieved successfully for a valid request
      uniqueIdentifier: TC_PMS_GetPartnerExpiringCertificate_01
      checkErrorsOnlyInResponse: true
      restMethod: get
      inputTemplate: pms/GetPartnerExpiringCertificate/GetPartnerExpiringCertificate
      outputTemplate: pms/GetPartnerExpiringCertificate/GetPartnerExpiringCertificateResult
      input: '{
      "expiryPeriod": "30"
}'
      output: '{
      "partnerId": "pms-111998",
      "partnerType": "Device_Provider",
      "isCertificateAvailable": true
}'
