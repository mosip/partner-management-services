UpdateOrDeactivateApiKey:
   Pms_UpdateOrDeactivateApiKey_All_Valid_Smoke:
    endPoint: /v1/partnermanager/partners/{partnerId}/policies/{policyId}/api-keys/{apiKeyName}
    description: Validate that updating the API Key Expiry Date with all valid inputs is successful and the changes are reflected correctly
    role: partneradmin
    uniqueIdentifier: TC_PMS_UpdateOrDeactivateApiKey_01
    checkErrorsOnlyInResponse: true
    restMethod: patch
    inputTemplate: pms/UpdateOrDeactivateApiKey/UpdateOrDeactivateApiKey
    outputTemplate: pms/UpdateOrDeactivateApiKey/UpdateOrDeactivateApiKeyResult
    input: '{
      "id": "mosip.pms.update.api.key.patch",
      "version": "1.0",
      "requestTime": "$TIMESTAMP$",
      "partnerId": "$ID:PartnerSelfRegistration_All_Valid_Smoke_sid_partnerId$",
      "policyId": "$ID:GenerateApiKey_AllValid_smoke_sid_policyId$",
      "apiKeyName": "$ID:GenerateApiKey_AllValid_smoke_sid_label$",
      "apiKeyExpiryDateTime": "$EXPIRYDATE$",
      "status": "De-active"
}'
    output: '{
}'
