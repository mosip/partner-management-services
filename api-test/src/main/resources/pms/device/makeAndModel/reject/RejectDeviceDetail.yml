RejectDeviceDetail:
   Pms_RejectDeviceDetail_All_Valid_Smoke:
      endPoint: /v1/partnermanager/devicedetail
      uniqueIdentifier: TC_PMS_rejectDeviceDetail_01
      description: Validate that device details are successfully rejected with all valid inputs
      role: partner
      checkErrorsOnlyInResponse: true
      additionalDependencies: TC_PMS_createServiceToSaveDeviceDetail_01
      restMethod: patch
      inputTemplate: pms/device/makeAndModel/approve/approveDeviceDetail
      outputTemplate: pms/device/makeAndModel/approve/approveDeviceDetailResult
      input: '{
    "approvalStatus": "De-activate",
    "id": "$ID:ServiceToSaveDeviceDetail_All_Valid_Smoke_sid_id$",
    "isItForRegistrationDevice": "true",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
    }'
   Pms_RejectDeviceDetail_Valid_Smoke:
      endPoint: /v1/partnermanager/devicedetail
      uniqueIdentifier: TC_PMS_rejectDeviceDetail_02
      description: Validate that device details are successfully rejected with valid inputs
      role: partner
      checkErrorsOnlyInResponse: true
      additionalDependencies: TC_PMS_createServiceToSaveDeviceDetail_02
      restMethod: patch
      inputTemplate: pms/device/makeAndModel/approve/approveDeviceDetail
      outputTemplate: pms/device/makeAndModel/approve/approveDeviceDetailResult
      input: '{
    "approvalStatus": "De-activate",
    "id": "$ID:ServiceToSaveDeviceDetail_sameMakeModelType_All_Valid_Smoke_sid_id$",
    "isItForRegistrationDevice": "true",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
    }'
   Pms_RejectDeviceDetail_Missing_InputParameter_approvalStatus:
      endPoint: /v1/partnermanager/devicedetail
      uniqueIdentifier: TC_PMS_rejectDeviceDetail_03
      description: Validate that device detail rejection fails when the approvalStatus input parameter is missing
      role: partner
      restMethod: patch
      additionalDependencies: TC_PMS_createServiceToSaveDeviceDetail_01
      inputTemplate: pms/device/makeAndModel/approve/approveDeviceDetail
      outputTemplate: pms/error
      input: '{
    "approvalStatus": "$REMOVE$",
    "id": "$ID:ServiceToSaveDeviceDetail_All_Valid_Smoke_sid_id$",
    "isItForRegistrationDevice": "true",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
}'


   Pms_RejectDeviceDetail_Missing_InputParameter_deviceId:
      endPoint: /v1/partnermanager/devicedetail
      uniqueIdentifier: TC_PMS_rejectDeviceDetail_04
      description: Validate that device detail rejection fails when the deviceId input parameter is missing
      role: partner
      restMethod: patch
      inputTemplate: pms/device/makeAndModel/approve/approveDeviceDetail
      outputTemplate: pms/error
      input: '{
    "approvalStatus": "Activate",
    "id": "$REMOVE$",
    "isItForRegistrationDevice": "true",
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
}'