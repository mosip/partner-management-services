RejectSecureBiometricInterface:
   Pms_RejectSecureBiometricInterface_All_Valid_Smoke:
      endPoint: /v1/partnermanager/securebiometricinterface
      uniqueIdentifier: TC_PMS_RejectSecureBiometricInterface_01
      description: Validate that a Secure Biometric Interface is successfully rejected with all valid inputs
      role: partner
      checkErrorsOnlyInResponse: true
      restMethod: patch
      inputTemplate: pms/device/SecureBiometricInterface/reject/rejectSecureBiometricInterface
      outputTemplate: pms/device/SecureBiometricInterface/reject/rejectSecureBiometricInterfaceResult
      input: '{
    "approvalStatus": "De-activate",
    "id": "$ID:SaveSecureBiometricInterface_Valid_Smoke_ForReject_sid_id$",
    "isItForRegistrationDevice": true,
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
    }'
    
   Pms_RejectSecureBiometricInterface_SpaVal_neg:
      endPoint: /v1/partnermanager/securebiometricinterface
      uniqueIdentifier: TC_PMS_RejectSecureBiometricInterface_03
      description: Validate that SBI rejection fails when an invalid input is provided
      role: partner
      restMethod: patch
      inputTemplate: pms/device/SecureBiometricInterface/reject/rejectSecureBiometricInterface
      outputTemplate: pms/error
      input: '{
    "approvalStatus": "De-activate",
    "id": "a0f2b0ca-92 66-4cf4-832c-7741d5b6a174",
    "isItForRegistrationDevice": true,
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
      "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
    }'
    
   Pms_RejectSecureBiometricInterface_Missing_InputParameter_approvalStatus:
      endPoint: /v1/partnermanager/securebiometricinterface
      uniqueIdentifier: TC_PMS_RejectSecureBiometricInterface_04
      description: Validate that SBI rejection fails when the approvalStatus input parameter is missing
      role: partner
      restMethod: patch
      inputTemplate: pms/device/SecureBiometricInterface/reject/rejectSecureBiometricInterface
      outputTemplate: pms/error
      input: '{
    "approvalStatus": "$REMOVE$",
    "id": "$ID:SaveSecureBiometricInterface_All_Valid_Smoke_sid_id$",
    "isItForRegistrationDevice": true,
    "requesttime": "$TIMESTAMP$"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_COR_001"
    }
  ]
}'