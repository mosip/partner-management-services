UpdatePolicyStatus:
   Pms_UpdatePolicyStatus_Active_auth_All_Valid_Smoke:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      description: Validate that updating the Policy status to Active with all valid inputs by an authorized user is successful
      role: partneradmin
      restMethod: patch
      inputTemplate: pms/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/UpdatePolicyStatus/updatePolicyStatusResult
      input: '{		
		"policyId": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_id$",
		"policygroupId":"$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_id$",
		"status":"Active",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
       "message": "status updated successfully"
    }'
    
   Pms_UpdatePolicyStatus_DeActive_auth_All_Valid_Smoke:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      role: partneradmin
	  description: Validate that updating the Policy status to DeActive with all valid inputs by an authorized user is successful
      restMethod: patch
      inputTemplate: pms/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/UpdatePolicyStatus/updatePolicyStatusResult
      input: '{		
		"policyId": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_id$",
		"policygroupId":"$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_id$",
		"status":"De-Active",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
       "message": "status updated successfully"
    }'
    
   Pms_UpdatePolicyStatus_Active_InValid:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      role: partneradmin
	  description: Validate that updating the Policy status to Active fails when invalid inputs are provided
      restMethod: patch
      inputTemplate: pms/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/error
      input: '{		
		"policyId": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_id$",
		"policygroupId":"$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_id$",
		"status":"De-Active",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
      "errors": [
        { 
          "errorCode": "PMS_POL_054",
          "message": "Cannot activate unpublished policy."         
        }
       ]
    }'
    
   Pms_UpdatePolicyStatus_PolicyId_InValid:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      role: partneradmin
	  description: Validate that updating the Policy status fails when an invalid policyId is provided
      restMethod: patch
      inputTemplate: pms/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/error
      input: '{		
		"policyId": "asfgv",
		"policygroupId":"$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_id$",
		"status":"De-Active",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
      "errors": [
        { 
          "errorCode": "PMS_POL_008",
          "message": "Policy ID does not exist"         
        }
       ]
    }'
    
