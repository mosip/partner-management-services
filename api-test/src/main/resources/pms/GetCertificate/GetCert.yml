GetPartnerCert:
   Pms_GetPartnerCert_AuthPartner_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/{partnerId}/certificate
      description: Validate that all partner certificates are successfully retrieved for an authenticated partner with valid inputs
      uniqueIdentifier: TC_PMS_GetPartnerCert_01  
      role: partnerauth
      checkErrorsOnlyInResponse: true
      restMethod: get
      inputTemplate: pms/GetCertificate/getCert
      outputTemplate: pms/GetCertificate/getCertResult
      input: '{
	"partnerId": "$ID:PartnerSelfRegistration_All_Valid_Smoke_sid_partnerId$"
}'
      output: ' {
}'
   Pms_GetPartnerCert_with_unregistered_partner_neg:
      endPoint: /v1/partnermanager/partners/{partnerId}/certificate
      description: Validate that partner certificate retrieval fails when requested for an unregistered partner
      uniqueIdentifier: TC_PMS_GetPartnerCert_03
      role: partnerauth
      restMethod: get
      inputTemplate: pms/GetCertificate/getCert
      outputTemplate: pms/error
      input: '{
	"partnerId": "848484848"
}'
      output: '{
      "errors": [
      {
       "errorCode": "PMS_PRT_005"
       }
       ]
}'

   Pms_GetPartnerCert_DeviceProvider_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/{partnerId}/certificate
      description: Validate that all partner certificates are successfully retrieved for a device provider with valid inputs
      uniqueIdentifier: TC_PMS_GetPartnerCert_04	  
      role: partnerdevice
      checkErrorsOnlyInResponse: true
      restMethod: get
      inputTemplate: pms/GetCertificate/getCert
      outputTemplate: pms/GetCertificate/getCertResult
      input: '{
	"partnerId": "$ID:PartnerSelfRegistration_Device_provider_All_Valid_Smoke_sid_partnerId$"
}'
      output: ' {
}'

   Pms_GetPartnerCert_FtmProvider_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/{partnerId}/certificate
      description: Get partner certificate succeeds for FTM providerValidate that all partner certificates are successfully retrieved for an FTM provider with valid inputs
      uniqueIdentifier: TC_PMS_GetPartnerCert_02	  
      role: partnerftm
      checkErrorsOnlyInResponse: true
      restMethod: get
      inputTemplate: pms/GetCertificate/getCert
      outputTemplate: pms/GetCertificate/getCertResult
      input: '{
	"partnerId": "$ID:PartnerSelfRegistration_Ftm_provider_All_Valid_Smoke_sid_partnerId$"
}'
