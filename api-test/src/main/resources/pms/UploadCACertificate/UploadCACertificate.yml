   Pms_UploadCACertificate_UploadAgain_Neg:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_UploadCACertificate_05
      description: Validate that re-uploading an already uploaded CA Certificate fails     
      role: partneradmin
      restMethod: post
      inputTemplate: pms/UploadCACertificate/uploadCertificate
      outputTemplate: pms/error
      input: '{
    "requesttime": "$TIMESTAMP$",
 	"certificateData": "$CACERT$",
 	"partnerId": "$ID:PartnerSelfRegistration_All_Valid_Smoke_sid_partnerId$",
 	"partnerDomain": "AUTH"
  }'
      output: ' {
      "errors": [
      {
       "errorCode": "KER-PCM-003"
       }
       ]
}'
   Pms_UploadCACertificate_with_invalid_data:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_UploadCACertificate_06
      description: Validate that uploading a CA Certificate fails when invalid data is provided      
      role: partneradmin
      restMethod: post
      allowedErrorCodes: KER-CRY-003,KER-KMS-013
      inputTemplate: pms/UploadCACertificate/uploadCertificate
      outputTemplate: pms/error
      input: '{
    "requesttime": "$TIMESTAMP$",
 	"certificateData": "dgdhshj@hhdeege",
 	"partnerId": "$REMOVE$",
 	"partnerDomain": "AUTH"
  }'
      output: ' {
      "errors": [
      {
       "errorCode": "KER-CRY-003"
       }
       ]
}'
   Pms_UploadCACertificate_with_blank_data:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_UploadCACertificate_07
      description: Validate that uploading a CA Certificate fails when the input data is blank  
      role: partneradmin
      checkErrorsOnlyInResponse: true
      restMethod: post
      inputTemplate: pms/UploadCACertificate/uploadCertificate
      outputTemplate: pms/error
      input: '{
    "requesttime": "$TIMESTAMP$",
 	"certificateData": "",
 	"partnerId": "$REMOVE$",
 	"partnerDomain": "AUTH"
  }'
      output: ' {
      "errors": [
      {
       "errorCode": "PMS_COR_001"
       }
       ]
}' 

