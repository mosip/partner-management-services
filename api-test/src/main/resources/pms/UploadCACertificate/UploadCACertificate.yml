UploadCACertificate:
   Pms_UploadCACertificate_All_Valid_Smoke:
      endPoint: /v1/partnermanager/partners/certificate/ca/upload
      uniqueIdentifier: TC_PMS_UploadCACertificate_01
      description: Validate that uploading a CA Certificate with all valid inputs is successful and reflected correctly
      role: partneradmin
      restMethod: post
      inputTemplate: pms/UploadCACertificate/uploadCertificate
      outputTemplate: pms/UploadCACertificate/uploadCertificateResult
      input: '{
    "requesttime": "$TIMESTAMP$",
 	"certificateData": "$CACERT$",
 	"partnerId": "$ID:PartnerSelfRegistration_All_Valid_Smoke_sid_partnerId$",
 	"partnerDomain": "AUTH"
  }'
      output: ' {
      "status": "Upload Success."
}' 
