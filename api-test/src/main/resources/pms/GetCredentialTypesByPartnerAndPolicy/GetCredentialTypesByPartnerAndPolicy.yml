   Pms_GetCredentialTypesByPartnerAndPolicy_AllValid_Smoke:
      endPoint: /v1/partnermanager/partners/{partnerId}/credentialtypes/{policyId}
      uniqueIdentifier: TC_PMS_GetCredentialTypesByPartnerAndPolicy_01
      description: Validate that credential types mapped to a partner and policy are successfully retrieved when all inputs are valid
      role: partner
      restMethod: get
      inputTemplate: pms/GetCredentialTypesByPartnerAndPolicy/getCredentialTypesByPartnerAndPolicy
      outputTemplate: pms/GetCredentialTypesByPartnerAndPolicy/getCredentialTypesByPartnerAndPolicyResult
      input: '{
    "partnerId": "$ID:PartnerSelfRegistration_credentialpartner_All_Valid_Smoke_sid_partnerId$",
    "policyId": "$ID:DefineDataSharePolicy_All_Valid_Smoke_sid_id$"
}'
      output: '{
   "credentialTypes": ["auth"]
}'

