UploadCertificateABISCASUBCA:
   Pms_UploadCACertificateForABIS_All_Valid_Smoke:
     endPoint: /v1/partnermanager/partners/certificate/ca/upload
     uniqueIdentifier: TC_PMS_UploadCertificateABISCASUBCA_01
     description: Validate that a CA certificate is uploaded successfully for ABIS Partner with all required valid inputs
     role: partneradmin
     restMethod: post
     inputTemplate: pms/ABISPartnerV3/UploadCertificateABIS/UploadCertificateCASUBCA
     outputTemplate: pms/ABISPartnerV3/UploadCertificateABIS/UploadCertificateResult
     input: '{
       "requesttime": "$TIMESTAMP$",
       "certificateData": "$CACERT$",
       "partnerId": "$ID:ABISPartnerRegistration_All_Valid_Smoke_Sid_partnerId$",
       "partnerDomain": "AUTH"
}'
     output: '{
       "status": "Upload Success."
}'
   Pms_UploadSUBCACertificateForABIS_All_Valid_Smoke:
     endPoint: /v1/partnermanager/partners/certificate/ca/upload
     uniqueIdentifier: TC_PMS_UploadCertificateABISCASUBCA_02
     description: Validate that a Sub-CA certificate is uploaded successfully for ABIS Partner with all required valid inputs
     role: partneradmin
     restMethod: post
     inputTemplate: pms/ABISPartnerV3/UploadCertificateABIS/UploadCertificateCASUBCA
     outputTemplate: pms/ABISPartnerV3/UploadCertificateABIS/UploadCertificateResult
     input: '{
       "requesttime": "$TIMESTAMP$",
       "certificateData": "$INTERCERT$",
       "partnerId": "$ID:ABISPartnerRegistration_All_Valid_Smoke_Sid_partnerId$",
       "partnerDomain": "AUTH"
}'
     output: '{
       "status": "Upload Success."
}'