UploadABISPartnerCertificate:
  Pms_UploadABISPartnerCertificate_All_Valid_Smoke:
    endPoint: /v1/partnermanager/partners/certificate/upload
    uniqueIdentifier: TC_PMS_UploadABISPartnerCertificate_01
    description: Validate that a Partner certificate is uploaded successfully for ABIS Partner(pms-111222) with all required valid inputs
    role: partneradmin
    checkErrorsOnlyInResponse: true
    restMethod: post
    additionalDependencies: TC_PMS_UploadCertificateABISCASUBCA_01,TC_PMS_UploadCertificateABISCASUBCA_02,TC_PMS_CreateABISPartnerRegistration_01
    inputTemplate: pms/ABISPartnerV3/UploadPartnerCertificateABIS/UploadABISPartnerCertificate
    outputTemplate: pms/ABISPartnerV3/UploadPartnerCertificateABIS/UploadABISPartnerCertResult
    input: '{
      "requesttime": "$TIMESTAMP$",
      "certificateData": "$PARTNERCERT$",
      "partnerId": "$ID:ABISPartnerRegistration_All_Valid_Smoke_Sid_partnerId$",
      "partnerDomain": "AUTH"
}'
    output: '{
}'