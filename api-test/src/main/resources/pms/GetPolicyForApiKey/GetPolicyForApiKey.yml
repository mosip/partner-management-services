GetPolicyForApiKey:
   Pms_GetPolicyForApiKey_allValid_smoke:
      endPoint: /v1/partnermanager/partners/{partnerId}/apikey/{apiKey}
      uniqueIdentifier: TC_PMS_GetPolicyForApiKey_01
      description: Validate that all policies associated with a valid API key are retrieved successfully
      role: partner
      restMethod: get
      inputTemplate: pms/GetPolicyForApiKey/getPolicyForApiKey
      outputTemplate: pms/GetPolicyForApiKey/getPolicyForApiKeyResult
      input: '{
    "partnerId": "$ID:PartnerSelfRegistration_All_Valid_Smoke_sid_partnerId$",
    "apiKey": "$ID:GenerateApiKeysforApprovedPolicies_AllValid_smoke_sid_apiKey$"
}'
      output: '{
   "partnerID": "pms-111999"      
}'
   Pms_GetPolicyForApiKey_InValid_partnerId:
      endPoint: /v1/partnermanager/partners/{partnerId}/apikey/{apiKey}
      uniqueIdentifier: TC_PMS_GetPolicyForApiKey_02
      description: Validate that retrieving policies for an API key fails when an invalid partner ID is provided
      role: partner
      restMethod: get
      inputTemplate: pms/GetPolicyForApiKey/getPolicyForApiKey
      outputTemplate: pms/error
      input: '{
    "partnerId": "fqgfg",
    "apiKey": "$ID:GenerateApiKeysforApprovedPolicies_AllValid_smoke_sid_apiKey$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_PMP_009"
    }
  ]   
}'
   Pms_GetPolicyForApiKey_InValid_apiKey:
      endPoint: /v1/partnermanager/partners/{partnerId}/apikey/{apiKey}
      uniqueIdentifier: TC_PMS_GetPolicyForApiKey_03
      description: Validate that retrieving policies fails when an invalid API key is provided
      role: partner
      restMethod: get
      inputTemplate: pms/GetPolicyForApiKey/getPolicyForApiKey
      outputTemplate: pms/error
      input: '{
    "partnerId": "110124",
    "apiKey": "dhbg"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_PMP_009"
    }
  ]   
}'