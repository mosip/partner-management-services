getPolicy:
   Pms_GetPolicy_All_Valid_Smoke_sid:
      endPoint: /v1/policymanager/policies/{policyId}
      uniqueIdentifier: TC_PMS_getPolicy_01
      description: Validate that all policies can be retrieved successfully for valid inputs
      role: partner
      restMethod: get
      inputTemplate: pms/policy/GetPolicy/getPolicy
      outputTemplate: pms/policy/GetPolicy/getPolicyResult
      input: '{
    "policyId": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_id$"
  }'
      output: ' {
        "policyGroupName": "$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_name$",
        "policyGroupDesc": "$RUNCONTEXT$desc mosip policy group19234",
        "policyGroupStatus": true,
        "policyName": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_name$",
        "policyDesc": "$RUNCONTEXT$desc mosip policy 19234",
        "authTokenType": "partner"
    }'
   Pms_GetPolicy_Invalid_InputParameter_policyId:
      endPoint: /v1/policymanager/policies/{policyId}
      uniqueIdentifier: TC_PMS_getPolicy_02
      description: Validate that retrieving a policy fails when an invalid policyId is provided
      role: partner
      restMethod: get
      inputTemplate: pms/policy/GetPolicy/getPolicy
      outputTemplate: pms/error
      input: '{
    "policyId": "policy123456"
  }'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_POL_008",
      "message": "Policy ID does not exist"
    }
  ]
}'
