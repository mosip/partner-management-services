UpdatePolicyStatus:
   Pms_UpdatePolicyStatus_DeActive_auth_All_Valid_Smoke:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      uniqueIdentifier: TC_PMS_UpdatePolicyStatus_01
      description: Validate that a policy can be deactivated successfully using valid authentication details
      role: partner
      restMethod: patch
      inputTemplate: pms/policy/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/policy/UpdatePolicyStatus/updatePolicyStatusResult
      input: '{		
		"policyId": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_id$",
		"policygroupId":"$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_id$",
		"status":"De-Active",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
       "message": "status updated successfully"
    }'

   Pms_UpdatePolicyStatus_DeActive_datashare_All_Valid_Smoke:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      uniqueIdentifier: TC_PMS_UpdatePolicyStatus_03
      description: Validate that a data share policy can be deactivated successfully with valid inputs
      role: partner
      restMethod: patch
      inputTemplate: pms/policy/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/policy/UpdatePolicyStatus/updatePolicyStatusResult
      input: '{		
		"policyId": "$ID:DefineDataSharePolicy_All_Valid_Smoke_sid_id$",
		"policygroupId":"$ID:DefinePolicyGroup_Active_All_Valid_Smoke_sid_id$",
		"status":"De-Active",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
       "message": "status updated successfully"
    }'
   Pms_UpdatePolicyStatus_Active_InValid:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      uniqueIdentifier: TC_PMS_UpdatePolicyStatus_04
      description: Validate that activating a policy fails when invalid inputs are provided
      role: partner
      restMethod: patch
      inputTemplate: pms/policy/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/error
      input: '{		
		"policyId": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_id$",
		"policygroupId":"$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_id$",
		"status":"active",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
  "errors": [
    {
      "errorCode": "PMS_POL_054",
      "message": "Cannot activate unpublished policy."
    }
  ]
    }' 
   Pms_UpdatePolicyStatus_PolicyId_InValid:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      uniqueIdentifier: TC_PMS_UpdatePolicyStatus_05
      description: Validate that updating the status of a policy fails when an invalid policy ID is provided
      role: partner
      restMethod: patch
      inputTemplate: pms/policy/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/error
      input: '{		
		"policyId": "asfgv",
		"policygroupId":"$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_id$",
		"status":"Active",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
  "errors": [
     {
         "errorCode": "PMS_POL_008",
         "message": "Policy ID does not exist"
     }
 ]
    }' 
   Pms_UpdatePolicyStatus_status_InValid:
      endPoint: /v1/policymanager/policies/{policyId}/group/{policygroupId}
      uniqueIdentifier: TC_PMS_UpdatePolicyStatus_06
      description: Validate that updating a policy status fails when an invalid status value is provided
      role: partner
      restMethod: patch
      inputTemplate: pms/policy/UpdatePolicyStatus/updatePolicyStatus
      outputTemplate: pms/error
      input: '{		
		"policyId": "$ID:DefinePolicy_All_Valid_Smoke_pms_sid_id$",
		"policygroupId":"$ID:DefinePolicyGroup_All_Valid_Smoke_pms_sid_id$",
		"status":"asfg",
		"requesttime": "$TIMESTAMP$"
}'
      output: ' {
  "errors": [
     {
         "errorCode": "PMS_POL_045",
         "message": "Policy Status either Active or De-active."
     }
  ]
}'
   Pms_UpdatePolicyStatus_PolicyGroupId_InValid:
