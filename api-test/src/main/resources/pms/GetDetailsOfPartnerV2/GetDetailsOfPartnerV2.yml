GetDetailsOfPartnerV2:
   Pms_GetDetailsOfPartnerV2_All_Valid_Smoke:
      endPoint: /v1/partnermanager/admin-partners/v2/{partnerId}
      description: Validate that all details of a partner including logoUrl and additionalInfo are successfully retrieved with valid inputs
      uniqueIdentifier: TC_PMS_GetPartnerDetailsV2_01
      role: partneradmin
      restMethod: get
      inputTemplate: pms/GetDetailsOfPartnerV2/getDetailsOfPartnerV2
      outputTemplate: pms/GetDetailsOfPartnerV2/getDetailsOfPartnerV2Result
      input: '{
	"partnerId": "$ID:MISPPartnerRegistration_All_Valid_Smoke_reqsid_Sid_partnerId$"
}'
      output: ' {
      "partnerId": "$ID:MISPPartnerRegistration_All_Valid_Smoke_reqsid_Sid_partnerId$",
      "logoUrl": "https://example.com/logo.png",
      "additionalInfo": {"orderRedirectUrl": "https://example.com/order-redirect"}
}'
   Pms_GetDetailsOfPartnerV2_invalid_token_Neg:
      endPoint: /v1/partnermanager/admin-partners/v2/{partnerId}
      description: Validate that partner details retrieval fails when an invalid token is used
      uniqueIdentifier: TC_PMS_GetPartnerDetailsV2_02
      role: invalidtoken
      restMethod: get
      inputTemplate: pms/GetDetailsOfPartnerV2/getDetailsOfPartnerV2
      outputTemplate: pms/error
      input: '{
	"partnerId": "111777"
}'
      output: '{
      "errors": [
      {
       "errorCode": "KER-ATH-401"
      }
      ]
}'
   Pms_GetDetailsOfPartnerV2_with_invalid_partner_Neg:
      endPoint: /v1/partnermanager/admin-partners/v2/{partnerId}
      description: Validate that partner details retrieval fails when requested for an invalid partner
      uniqueIdentifier: TC_PMS_GetPartnerDetailsV2_03
      role: partneradmin
      restMethod: get
      inputTemplate: pms/GetDetailsOfPartnerV2/getDetailsOfPartnerV2
      outputTemplate: pms/error
      input: '{
	"partnerId": "@334ds356"
}'
      output: '{
      "errors": [
      {
       "errorCode": "PMS_PRT_005"
      }
      ]
}'
   Pms_GetDetailsOfPartnerV2_Without_PartnerAdmin_Role_Neg:
      endPoint: /v1/partnermanager/admin-partners/v2/{partnerId}
      description: Validate that a non-PARTNER_ADMIN role is forbidden from retrieving partner details
      uniqueIdentifier: TC_PMS_GetPartnerDetailsV2_04
      role: partnerauth
      restMethod: get
      inputTemplate: pms/GetDetailsOfPartnerV2/getDetailsOfPartnerV2
      outputTemplate: pms/error
      input: '{
	"partnerId": "$ID:MISPPartnerRegistration_All_Valid_Smoke_reqsid_Sid_partnerId$"
}'
      output: '{
      "errors": [
      {
       "errorCode": "KER-ATH-403"
      }
      ]
}'
   Pms_GetDetailsOfPartnerV2_SpecialCharactersIn_partnerId_Neg:
      endPoint: /v1/partnermanager/admin-partners/v2/{partnerId}
      description: Validate that partner details retrieval fails when partnerId contains characters outside the allowed format
      uniqueIdentifier: TC_PMS_GetPartnerDetailsV2_05
      role: partneradmin
      restMethod: get
      inputTemplate: pms/GetDetailsOfPartnerV2/getDetailsOfPartnerV2
      outputTemplate: pms/error
      input: '{
	"partnerId": "@#%^&ABCD"
}'
      output: '{
      "errors": [
      {
       "errorCode": "PMS_REQUEST_ERROR_007"
      }
      ]
}'
