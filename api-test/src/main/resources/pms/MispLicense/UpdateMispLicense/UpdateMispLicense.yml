UpdateMispLicense:
   Pms_UpdateMispLicense_Deactive_allValid_smoke:
      endPoint: /v1/partnermanager/misps
      uniqueIdentifier: TC_PMS_UpdateMispLicense_01
      description: Validate that a MISP license is successfully deactivated when a valid deactivation request is submitted
      role: partner
      restMethod: put
      inputTemplate: pms/MispLicense/UpdateMispLicense/updateMispLicense
      outputTemplate: pms/MispLicense/UpdateMispLicense/updateMispLicenseResult
      input: '{
   "providerId": "MISP-AUTOMATION",
   "licenseKeyStatus": "De-active",
   "licenseKey": "$ID:CreateMispLicense_allValid_smoke_sid_licenseKey$"
}'
      output: '{
   "providerId": "MISP-AUTOMATION",
    "licenseKeyStatus": "de-active"
}'
   Pms_UpdateMispLicense_Active_allValid_smoke:
      endPoint: /v1/partnermanager/misps
      uniqueIdentifier: TC_PMS_UpdateMispLicense_02
      description: Validate that a MISP license is successfully activated when a valid activation request is submitted
      role: partner
      restMethod: put
      inputTemplate: pms/MispLicense/UpdateMispLicense/updateMispLicense
      outputTemplate: pms/MispLicense/UpdateMispLicense/updateMispLicenseResult
      input: '{
   "providerId": "MISP2-AUTOMATION",
   "licenseKeyStatus": "Active",
   "licenseKey": "$ID:CreateMispLicense_MispLicense_allValid_smoke_sid_licenseKey$"
}'
      output: '{
   "providerId": "MISP2-AUTOMATION",
    "licenseKeyStatus": "active"
}'
   Pms_UpdateMispLicense_InValid_licenseKeyStatus:
      endPoint: /v1/partnermanager/misps
      uniqueIdentifier: TC_PMS_UpdateMispLicense_03
      description: Validate that updating a MISP license fails when an invalid license key status is provided
      role: partner
      restMethod: put
      inputTemplate: pms/MispLicense/UpdateMispLicense/updateMispLicense
      outputTemplate: pms/error
      input: '{
   "providerId": "MISP-AUTOMATION",
    "licenseKeyStatus": "inactive",
    "licenseKey": "adfvad"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_MSP_407"
    }
  ]
}'