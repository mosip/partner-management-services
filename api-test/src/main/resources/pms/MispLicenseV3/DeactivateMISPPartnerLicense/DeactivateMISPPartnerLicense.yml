DeactivateMISPPartnerLicense:
  Pms_DeactivateMISPPartnerLicense_All_Valid_Smoke:
    endPoint: /v1/partnermanager/misp-licenses/{mispLicenseId}
    uniqueIdentifier: TC_PMS_DeactivateMISPPartnerLicense_01
    description: Validate that a MISP partner license is successfully deactivated when a valid request is submitted
    role: partneradmin
    restMethod: patch
    inputTemplate: pms/MispLicenseV3/DeactivateMISPPartnerLicense/DeactivateMISPPartnerLicense
    outputTemplate: pms/MispLicenseV3/DeactivateMISPPartnerLicense/DeactivateMISPPartnerLicenseResult
    input: '{
      "id": "mosip.pms.update.misp.license.patch",
      "version": "1.0",
      "requestTime": "$TIMESTAMP$",
      "mispLicenseId": "$ID:GenerateMISPPartnerLicense_Regenerate_Via_Repeat_Post_sid_mispLicenseId$",
      "status": "INACTIVE"
}'
    output: '{
      "status": "INACTIVE"
}'