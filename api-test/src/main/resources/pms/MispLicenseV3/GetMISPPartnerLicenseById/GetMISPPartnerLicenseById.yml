GetMISPPartnerLicenseById:
  Pms_GetMISPPartnerLicenseById_All_Valid_Smoke:
    endPoint: /v1/partnermanager/misp-licenses/{mispLicenseId}
    uniqueIdentifier: TC_PMS_GetMISPPartnerLicenseById_01
    description: Validate that a MISP partner license is successfully retrieved by mispLicenseId and is ACTIVE
    role: partneradmin
    restMethod: get
    inputTemplate: pms/MispLicenseV3/GetMISPPartnerLicenseById/getMISPPartnerLicenseById
    outputTemplate: pms/MispLicenseV3/GetMISPPartnerLicenseById/GetMISPPartnerLicenseByIdResult
    input: '{
      "mispLicenseId": "$ID:GenerateMISPPartnerLicense_Regenerate_Via_Repeat_Post_sid_mispLicenseId$"
}'
    output: '{
      "mispLicenseId": "$ID:GenerateMISPPartnerLicense_Regenerate_Via_Repeat_Post_sid_mispLicenseId$",
      "status": "ACTIVE",
      "maskedLicenseKey": "$REGEXP:\\\\*+.{4}",
      "policyId": "$ID:DefineMISPPolicy_All_Valid_Smoke_pms_sid_id$",
      "policyName": "$RUNCONTEXT$mosip policy MISP API Policy 12345",
      "policyDescription": "$RUNCONTEXT$desc mosip policy MISP API Policy 12345",
      "policyGroupId": "$ID:DefinePolicyGroup_MISP_PolicyGroup_All_Valid_Smoke_sid_id$",
      "policyGroupName": "$ID:DefinePolicyGroup_MISP_PolicyGroup_All_Valid_Smoke_sid_name$",
      "policyGroupDescription": "$RUNCONTEXT$mosip policy group MISP"
}'
  Pms_GetMISPPartnerLicenseById_Old_License_Is_Inactive_After_Regenerate:
    endPoint: /v1/partnermanager/misp-licenses/{mispLicenseId}
    uniqueIdentifier: TC_PMS_GetMISPPartnerLicenseById_02
    description: Validate that the original MISP partner license becomes INACTIVE after a new license is generated for the same partner via repeat POST
    role: partneradmin
    restMethod: get
    inputTemplate: pms/MispLicenseV3/GetMISPPartnerLicenseById/getMISPPartnerLicenseById
    outputTemplate: pms/MispLicenseV3/GetMISPPartnerLicenseById/GetMISPPartnerLicenseByIdResult
    input: '{
      "mispLicenseId": "$ID:GenerateMISPPartnerLicense_All_Valid_Smoke_sid_mispLicenseId$"
}'
    output: '{
      "mispLicenseId": "$ID:GenerateMISPPartnerLicense_All_Valid_Smoke_sid_mispLicenseId$",
      "status": "INACTIVE",
      "maskedLicenseKey": "$REGEXP:\\\\*+.{4}",
      "policyId": "$ID:DefineMISPPolicy_All_Valid_Smoke_pms_sid_id$",
      "policyName": "$RUNCONTEXT$mosip policy MISP API Policy 12345",
      "policyDescription": "$RUNCONTEXT$desc mosip policy MISP API Policy 12345",
      "policyGroupId": "$ID:DefinePolicyGroup_MISP_PolicyGroup_All_Valid_Smoke_sid_id$",
      "policyGroupName": "$ID:DefinePolicyGroup_MISP_PolicyGroup_All_Valid_Smoke_sid_name$",
      "policyGroupDescription": "$RUNCONTEXT$mosip policy group MISP"
}'
  Pms_GetMISPPartnerLicenseById_Invalid_Token_Neg:
    endPoint: /v1/partnermanager/misp-licenses/{mispLicenseId}
    uniqueIdentifier: TC_PMS_GetMISPPartnerLicenseById_03
    description: Validate that the API returns an error when attempting to retrieve a MISP partner license by mispLicenseId using an invalid access token
    role: invalidtoken
    restMethod: get
    inputTemplate: pms/MispLicenseV3/GetMISPPartnerLicenseById/getMISPPartnerLicenseById
    outputTemplate: pms/error
    input: '{
      "mispLicenseId": "$ID:GenerateMISPPartnerLicense_All_Valid_Smoke_sid_mispLicenseId$"
}'
    output: '{
      "errors": [
        {
           "errorCode": "KER-ATH-401"
        }
    ]
}'
  Pms_GetMISPPartnerLicenseById_Invalid_MispLicenseId_Neg:
    endPoint: /v1/partnermanager/misp-licenses/{mispLicenseId}
    uniqueIdentifier: TC_PMS_GetMISPPartnerLicenseById_04
    description: Validate that the API returns an error when attempting to retrieve a MISP partner license using an invalid mispLicenseId
    role: partneradmin
    restMethod: get
    inputTemplate: pms/MispLicenseV3/GetMISPPartnerLicenseById/getMISPPartnerLicenseById
    outputTemplate: pms/error
    input: '{
      "mispLicenseId": "@@invalid-mispLicenseId"
}'
    output: '{
      "errors": [
        {
           "errorCode": "PMS_MSP_441"
        }
    ]
}'
  Pms_GetMISPPartnerLicenseById_Literal_Null_String_Neg:
    endPoint: /v1/partnermanager/misp-licenses/{mispLicenseId}
    uniqueIdentifier: TC_PMS_GetMISPPartnerLicenseById_05
    description: Validate that the API returns an error when the literal string "null" is provided as the mispLicenseId
    role: partneradmin
    restMethod: get
    inputTemplate: pms/MispLicenseV3/GetMISPPartnerLicenseById/getMISPPartnerLicenseById
    outputTemplate: pms/error
    input: '{
      "mispLicenseId": "null"
}'
    output: '{
      "errors": [
        {
           "errorCode": "PMS_MSP_441"
        }
    ]
}'
