      role: partneradmin
      restMethod: post
      inputTemplate: pms/MispLicenseV3/GenerateMISPPartnerLicense/GenerateMISPPartnerLicense
      outputTemplate: pms/MispLicenseV3/GenerateMISPPartnerLicense/GenerateMISPPartnerLicenseResult
      input: '{
        "id": "mosip.pms.misp.generate.license.post",
        "version": "1.0",
        "requestTime": "$TIMESTAMP$",
        "partnerId": "$ID:MISPPartnerRegistration_All_Valid_Smoke_reqsid_Sid_partnerId$",
        "policyId": "$ID:DefineMISPPolicy_All_Valid_Smoke_pms_sid_id$",
