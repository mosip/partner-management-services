RegenerateMISPPartnerLicense:
  Pms_RegenerateMISPPartnerLicense_All_Valid_Smoke_sid:
    endPoint: /v1/partnermanager/misp-licenses/{partnerId}
    uniqueIdentifier: TC_PMS_RegenerateMISPPartnerLicense_01
    description: Validate that a MISP partner license is successfully regenerated for a valid partner ID and all required parameters as part of a smoke test
    role: partneradmin
    restMethod: put
    inputTemplate: pms/MispLicenseV3/RegenerateMISPPartnerLicense/RegenerateMISPPartnerLicense
    outputTemplate: pms/MispLicenseV3/RegenerateMISPPartnerLicense/RegenerateMISPPartnerLicenseResult
    input: '{
      "id": "mosip.pms.regenerate.misp.license.put",
      "version": "1.0",
      "requestTime": "$TIMESTAMP$",
	  "partnerId": "$ID:GenerateMISPPartnerLicense_All_Valid_Smoke_sid_partnerId$",
	  "policyId": "$ID:GenerateMISPPartnerLicense_All_Valid_Smoke_sid_policyId$",
      "licenseKeyName": "$LICENSE_KEY_NAME$",
      "expiryDate": "2035-10-10"
}'
    output: '{   
}'
