UploadPartnerCert:
  Pms_UploadCert_All_Valid_Smoke:
    endPoint: /v1/partnermanager/partners/certificate/upload
    uniqueIdentifier: TC_PMS_UploadPartnerCert_Printpartner_01
    description: Validate that certificates can be uploaded successfully with all valid inputs
    role: partner
    checkErrorsOnlyInResponse: true
    restMethod: post
    additionalDependencies: TC_PMS_uploadCACert_printpartner_01,TC_PMS_uploadCACert_printpartner_02
    inputTemplate: pms/PrintPartner/UploadCert/uploadCert
    outputTemplate: pms/PrintPartner/UploadCert/uploadCertResult
    input: '{
      "requesttime": "$TIMESTAMP$",
      "certificateData": "$PARTNERCERT$",
      "partnerId": "$ID:PartnerSelfRegistration_PrintPartner_AllValid_Smoke_sid_partnerId$"
    }'
    output: '{}'
