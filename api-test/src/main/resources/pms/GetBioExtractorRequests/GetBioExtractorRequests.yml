GetBioExtractorRequests:
   Pms_GetBioExtractorRequests_allValid_smoke:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/bio-extractors-request
      uniqueIdentifier: TC_PMS_GetBioExtractorRequests_01
      description: Validate that bio-extractor requests for a partner-policy request are successfully retrieved with a valid requestId
      role: partneradmin
      restMethod: get
      inputTemplate: pms/GetBioExtractorRequests/getBioExtractorRequests
      outputTemplate: pms/GetBioExtractorRequests/getBioExtractorRequestsResult
      input: '{
    "requestId": "$ID:SubmitPartnerApiKeyRequest_Rejection_All_Valid_Smoke_sid_mappingkey$"
}'
      output: '{
  "partnerPolicyRequestId": "$ID:SubmitPartnerApiKeyRequest_Rejection_All_Valid_Smoke_sid_mappingkey$",
  "statusCode": "InProgress"
}'
   Pms_GetBioExtractorRequests_InValid_requestId:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/bio-extractors-request
      uniqueIdentifier: TC_PMS_GetBioExtractorRequests_02
      description: Validate that bio-extractor request retrieval fails when an invalid requestId is provided
      role: partneradmin
      restMethod: get
      inputTemplate: pms/GetBioExtractorRequests/getBioExtractorRequests
      outputTemplate: pms/error
      input: '{
    "requestId": "invalid-request-id"
}'
      output: '{
   "errors": [
    {
      "errorCode": "PMS_PRT_064"
    }
  ]
}'

   Pms_GetBioExtractorRequests_Without_AccessToken_Neg:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/bio-extractors-request
      uniqueIdentifier: TC_PMS_GetBioExtractorRequests_03
      description: Validate that bio-extractor request retrieval fails when no access token is provided
      role: invalidtoken
      restMethod: get
      inputTemplate: pms/GetBioExtractorRequests/getBioExtractorRequests
      outputTemplate: pms/error
      input: '{
    "requestId": "$ID:SubmitPartnerApiKeyRequest_Rejection_All_Valid_Smoke_sid_mappingkey$"
}'
      output: '{
   "errors": [
    {
      "errorCode": "KER-ATH-401"
    }
  ]
}'

   Pms_GetBioExtractorRequests_SpecialChar_requestId_Neg:
      endPoint: /v1/partnermanager/partner-policy-requests/{requestId}/bio-extractors-request
      uniqueIdentifier: TC_PMS_GetBioExtractorRequests_04
      description: Validate that bio-extractor request retrieval fails when a special character requestId is provided
      role: partneradmin
      restMethod: get
      checkOnlyStatusCodeInResponse: true
      inputTemplate: pms/GetBioExtractorRequests/getBioExtractorRequests
      outputTemplate: pms/responseCode
      input: '{
    "requestId": "!@#$%^*()"
}'
